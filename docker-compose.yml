services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [postgres, redis, neo4j, qdrant, chroma]
  ui:
    build: ./frontend
    environment: ["API_URL=http://api:8000"]
    ports: ["8501:8501"]
    depends_on: [api]
  postgres:
    image: postgres:16-alpine
    environment: ["POSTGRES_USER=edu", "POSTGRES_PASSWORD=edu", "POSTGRES_DB=edu"]
    volumes: ["pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
  neo4j:
    image: neo4j:5-community
    environment: ["NEO4J_AUTH=neo4j/change-me"]
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j:/data"]
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports: ["6333:6333"]
    volumes: ["qdrant:/qdrant/storage"]
  chroma:
    image: chromadb/chroma:0.5.23
    ports: ["8001:8000"]
    volumes: ["chroma:/chroma/chroma"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: ["MINIO_ROOT_USER=minio", "MINIO_ROOT_PASSWORD=change-me"]
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]
volumes: {pg: {}, neo4j: {}, qdrant: {}, chroma: {}, minio: {}}
